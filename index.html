<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X-Wing HotAC Companion</title>
<style>
@media(max-width:760px){main .grid[style*="minmax(260px,340px)"]{grid-template-columns:1fr!important}}
:root{--bg:#0b0f17;--panel:#131a26;--panel2:#1a2333;--line:#27324a;--text:#e6ecf5;--dim:#8fa0bd;--acc:#ffb84d;--acc2:#4da3ff;--bad:#ff6b6b;--good:#5fd18a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:18px;margin:0;letter-spacing:.04em;color:var(--acc)}
header .sp{flex:1}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{background:none;border:1px solid transparent;color:var(--dim);padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{color:var(--bg);background:var(--acc);font-weight:600}
nav button:hover:not(.on){border-color:var(--line);color:var(--text)}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2,.card h3{margin:0 0 8px;font-size:16px}
.card h3{color:var(--acc)}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px;text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 9px;border-radius:6px;font:inherit}
input[type=checkbox]{width:auto}
button.b{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit}
button.b:hover{border-color:var(--acc2)}
button.p{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
button.d{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}
.row .f{flex:1 1 120px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;margin:2px}
.tag button{background:none;border:0;color:var(--dim);cursor:pointer;padding:0}
.dim{color:var(--dim)}
.big{font-size:28px;font-weight:700;color:var(--acc)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase}
tr.hl td{background:rgba(255,184,77,.12)}
td.hl{background:rgba(255,184,77,.18);font-weight:600}
.img{width:100%;border-radius:8px;display:block;background:var(--panel2);min-height:80px}
.note{border-left:3px solid var(--acc2);padding:6px 10px;background:var(--panel2);border-radius:0 6px 6px 0;margin:8px 0;font-size:13px;color:var(--dim)}
.log{max-height:260px;overflow:auto;font-size:13px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.roll{font-size:40px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.ok{color:var(--good)}.bad{color:var(--bad)}
@media print{header,nav,button{display:none!important}body{background:#fff;color:#000}.card{border-color:#999;background:#fff}}
</style>
</head>

function aiGen(ship,level){
var lo,hi;
AI_RANGES.forEach(function(r){if(r[0]===ship){lo=r[1];hi=r[2]}});
var roll=ship==="Any"?rr(1,28):rr(lo,hi);
var row=AI_ROWS.filter(function(r){return r[0]===roll})[0];
return {roll:roll,row:row,level:level};

slotKeys(s).forEach(function(k){var i=s.up[k.key];if(i!=null){var u=E1_UPGRADES[i];out.push("  "+k.type+": "+u[0]+" ("+u[2]+")")}});
});
return out.join("\n");
}
function squadXWS(sq){
return{name:sq.name,faction:E1_FX[sq.faction],points:squadPts(sq),version:"0.3.0",pilots:sq.ships.map(function(s){
var pr=E1_PILOTS[s.p],ups={};
slotKeys(s).forEach(function(k){var i=s.up[k.key];if(i!=null){var u=E1_UPGRADES[i],sl=xwsSlot(u[1]);(ups[sl]=ups[sl]||[]).push(u[0]===""?"":xwsOf(u))}});
return{name:pr[9],ship:(E1_SHIPS[pr[2]]||[0,""])[1],upgrades:ups};
})};
}
function xwsOf(u){return u[15]}
function importXWS(txt){
var d=JSON.parse(txt);
var fac=Object.keys(E1_FX).filter(function(k){return E1_FX[k]===d.faction})[0];
if(!fac)throw new Error("Unknown faction "+d.faction);
var sq=newSquad(fac);sq.name=d.name||"Imported squad";
var skipped=0;
(d.pilots||[]).forEach(function(p){
var pi=-1;
E1_PILOTS.forEach(function(r,i){if(pi<0&&r[9]===p.name&&(E1_SHIPS[r[2]]||[0,""])[1]===p.ship)pi=i});
if(pi<0){skipped++;return}
var sh={p:pi,up:{}};
Object.keys(p.upgrades||{}).forEach(function(slot){
(p.upgrades[slot]||[]).forEach(function(id){
var ui=-1;
E1_UPGRADES.forEach(function(u,i){if(ui<0&&u[15]===id&&xwsSlot(u[1])===slot)ui=i});
if(ui<0){skipped++;return}
var free=slotKeys(sh).filter(function(k){return k.type===E1_UPGRADES[ui][1]&&sh.up[k.key]==null})[0];
if(!free){skipped++;return}
sh.up[free.key]=ui;
});
});
sq.ships.push(sh);
});
return{sq:sq,skipped:skipped};
}
function viewBuilder(){
if(S.edition==="xwa")return viewBuilderX();
var sq=curSquad();
sq.ships.forEach(normalizeShip);
var pts=squadPts(sq),warn=squadWarnings(sq);
var bar=h("div",{class:"card"},[
h("div",{class:"row"},[
h("div",{class:"f"},field("Squad",sel(S.squads.map(function(s,i){return[String(i),s.name+" ("+squadPts(s)+")"]}),String(S.sq),function(v){S.sq=Number(v);BLD.out=null;refresh()}))),
btn("New",function(){S.squads.push(newSquad(sq.faction));S.sq=S.squads.length-1;BLD.out=null;refresh()},"p"),
btn("Duplicate",function(){var c=JSON.parse(JSON.stringify(sq));c.id=Date.now()+"";c.name=sq.name+" copy";S.squads.push(c);S.sq=S.squads.length-1;refresh()}),
btn("Delete",function(){if(confirm("Delete this squad?")){S.squads.splice(S.sq,1);S.sq=0;refresh()}},"d")
]),
h("div",{class:"row"},[
h("div",{class:"f"},field("Name",txt(sq.name,function(v){sq.name=v;refresh()}))),
h("div",{class:"f"},field("Faction",sel(Object.keys(E1_FX),sq.faction,function(v){if(v===sq.faction)return;if(sq.ships.length&&!confirm("Changing faction clears the squad. Continue?")){refresh();return}sq.faction=v;sq.ships=[];BLD.ship="";BLD.pilot="";refresh()}))),
h("div",{style:"width:130px"},field("Point limit",txt(sq.limit,function(v){sq.limit=v;refresh()},"number")))
]),
h("div",{class:"row",style:"margin-top:10px"},[
h("div",{class:"big",style:pts>sq.limit?"color:var(--bad)":""},pts+" / "+sq.limit),
h("span",{class:"dim"},sq.ships.length+" ship"+(sq.ships.length===1?"":"s"))
]),
warn.length?h("div",{class:"note bad"},warn.join(" · ")):h("div",{class:"note ok"},"Squad is legal."),
h("div",{class:"row"},[
btn("Squad text",function(){BLD.out="text";BLD.text=squadText(sq);render()}),
btn("XWS JSON",function(){BLD.out="xws";BLD.text=JSON.stringify(squadXWS(sq),null,2);render()}),
btn("Import XWS",function(){BLD.out="import";BLD.text="";render()}),
btn("Print",function(){window.print()})
])
]);
var out=null;
if(BLD.out){
var ta=h("textarea",{rows:12,onchange:function(e){BLD.text=e.target.value}},BLD.text);
out=h("div",{class:"card"},[
h("h3",{},BLD.out==="text"?"Squad text":BLD.out==="xws"?"XWS JSON":"Paste XWS JSON to import"),
ta,
h("div",{class:"row",style:"margin-top:8px"},[
BLD.out==="import"?btn("Import",function(){
try{var r=importXWS(ta.value);S.squads.push(r.sq);S.sq=S.squads.length-1;BLD.out=null;log("Imported squad "+r.sq.name+(r.skipped?" ("+r.skipped+" cards skipped)":""));if(r.skipped)alert(r.skipped+" cards could not be matched");refresh()}catch(e){alert("Import failed: "+e.message)}
},"p"):btn("Copy",function(){ta.select();try{document.execCommand("copy")}catch(e){}}),
btn("Close",function(){BLD.out=null;render()})
])
]);
}
var ships=Array.from(new Set(E1_PILOTS.filter(function(r){return r[1]===sq.faction}).map(function(r){return r[2]}))).sort();
if(ships.indexOf(BLD.ship)<0)BLD.ship=ships[0]||"";
var pilots=[];
E1_PILOTS.forEach(function(r,i){if(r[1]===sq.faction&&r[2]===BLD.ship)pilots.push(i)});
pilots.sort(function(a,b){return E1_PILOTS[b][3]-E1_PILOTS[a][3]||E1_PILOTS[a][0].localeCompare(E1_PILOTS[b][0])});
if(pilots.indexOf(Number(BLD.pilot))<0)BLD.pilot=String(pilots[0]);
var addp=h("div",{class:"card"},[
h("h3",{},"Add a ship"),
h("div",{class:"row"},[
h("div",{class:"f"},field("Ship",sel(ships,BLD.ship,function(v){BLD.ship=v;BLD.pilot="";render()}))),
h("div",{class:"f",style:"flex:2 1 260px"},field("Pilot",(function(){
var s=h("select",{onchange:function(){BLD.pilot=s.value}},pilots.map(function(i){
var r=E1_PILOTS[i],taken=r[8]&&nameTaken(sq,r[0],null,null);
return h("option",{value:String(i),disabled:taken?"disabled":null},(r[8]?"• ":"")+r[0]+" (PS "+r[3]+", "+r[4]+" pts)"+(taken?" - already in squad":""));
}));
s.value=BLD.pilot;
return s;
})())),
btn("Add to squad",function(){
var i=Number(BLD.pilot);
if(isNaN(i))return;
var r=E1_PILOTS[i];
if(r[8]&&nameTaken(sq,r[0],null,null)){alert("That unique card is already in the squad");return}
sq.ships.push({p:i,up:{}});refresh();
},"p")
])
]);
var cards=sq.ships.map(function(sh,si){
var pr=E1_PILOTS[sh.p];
var slotRows=slotKeys(sh).map(function(k){
var cur=sh.up[k.key];
var opts=[["","— empty —"]];
E1_UPGRADES.forEach(function(u,idx){
if(u[1]!==k.type)return;
if(idx===cur||upgradeOK(sq,sh,idx,k.key))opts.push([String(idx),(u[7]?"• ":"")+u[0]+" ("+u[2]+")"]);
});
opts.sort(function(a,b){return a[0]===""?-1:b[0]===""?1:a[1].localeCompare(b[1])});
return field(k.type,sel(opts,cur==null?"":String(cur),function(v){
if(v==="")delete sh.up[k.key];else sh.up[k.key]=Number(v);
normalizeShip(sh);refresh();
}));
});
return h("div",{class:"card"},[
h("div",{class:"row"},[h("h3",{class:"f"},(pr[8]?"• ":"")+pr[0]),h("div",{class:"big",style:"font-size:20px"},shipPts(sh))]),
h("div",{class:"dim"},pr[2]+" · PS "+shipSkill(sh)),
h("img",{class:"img",loading:"lazy",src:e1img(pr[7]),alt:pr[0],style:"max-height:200px;object-fit:contain;margin:8px 0",onerror:function(e){e.target.style.display="none"}}),
h("div",{style:"font-size:13px"},pr[6]),
h("div",{},slotRows),
h("div",{class:"row",style:"margin-top:10px"},[
pr[8]?null:btn("Duplicate",function(){sq.ships.splice(si+1,0,JSON.parse(JSON.stringify(sh)));refresh()}),
btn("Remove",function(){sq.ships.splice(si,1);refresh()},"d")
])
]);
});
return h("div",{},[bar,out,h("div",{style:"height:12px"}),addp,h("div",{class:"grid g3",style:"margin-top:12px"},cards)]);
}

var TABS=[["builder","Builder",viewBuilder],["campaign","Campaign",viewCampaign],["pilots","Pilots",viewPilots],["hangar","Hangar",viewHangar],["ai","AI Ships",viewAI],["docs","Rules",viewDocs],["missions","Missions",viewMissions],["rules","Rules / Play",viewRules],["browser","Database",viewBrowser],["settings","Settings",viewSettings]];
function render(){
var sub=document.getElementById("subtitle");
sub.textContent=MODULES[S.module].label+" · Season "+S.season+" · Mission "+S.mission;
var es=document.getElementById("edSel");
if(!es.options.length){Object.keys(EDITIONS).forEach(function(k){es.appendChild(h("option",{value:k},EDITIONS[k].label))});es.addEventListener("change",function(){S.edition=es.value;log("Edition: "+EDITIONS[S.edition].label);refresh()})}
es.value=S.edition;
var nav=document.getElementById("nav");nav.innerHTML="";
TABS.forEach(function(t){nav.appendChild(h("button",{class:S.tab===t[0]?"on":"",onclick:function(){S.tab=t[0];refresh()},type:"button"},t[1]))});
var main=document.getElementById("main");main.innerHTML="";
var t=TABS.filter(function(x){return x[0]===S.tab})[0]||TABS[0];
main.appendChild(t[2]());
}
render();
})();
</script>
