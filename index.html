<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X-Wing HotAC Companion</title>
<style>
:root{--bg:#0b0f17;--panel:#131a26;--panel2:#1a2333;--line:#27324a;--text:#e6ecf5;--dim:#8fa0bd;--acc:#ffb84d;--acc2:#4da3ff;--bad:#ff6b6b;--good:#5fd18a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:18px;margin:0;letter-spacing:.04em;color:var(--acc)}
header .sp{flex:1}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{background:none;border:1px solid transparent;color:var(--dim);padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{color:var(--bg);background:var(--acc);font-weight:600}
nav button:hover:not(.on){border-color:var(--line);color:var(--text)}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2,.card h3{margin:0 0 8px;font-size:16px}
.card h3{color:var(--acc)}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px;text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 9px;border-radius:6px;font:inherit}
input[type=checkbox]{width:auto}
button.b{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit}
button.b:hover{border-color:var(--acc2)}
button.p{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
button.d{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}
.row .f{flex:1 1 120px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;margin:2px}
.tag button{background:none;border:0;color:var(--dim);cursor:pointer;padding:0}
.dim{color:var(--dim)}
.big{font-size:28px;font-weight:700;color:var(--acc)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase}
tr.hl td{background:rgba(255,184,77,.12)}
td.hl{background:rgba(255,184,77,.18);font-weight:600}
.img{width:100%;border-radius:8px;display:block;background:var(--panel2);min-height:80px}
.note{border-left:3px solid var(--acc2);padding:6px 10px;background:var(--panel2);border-radius:0 6px 6px 0;margin:8px 0;font-size:13px;color:var(--dim)}
.log{max-height:260px;overflow:auto;font-size:13px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.roll{font-size:40px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.ok{color:var(--good)}.bad{color:var(--bad)}
@media print{header,nav,button{display:none!important}body{background:#fff;color:#000}.card{border-color:#999;background:#fff}}
</style>
</head>

function h(tag,attrs,kids){

function aiGen(ship,level){
var lo,hi;
AI_RANGES.forEach(function(r){if(r[0]===ship){lo=r[1];hi=r[2]}});
var roll=ship==="Any"?rr(1,28):rr(lo,hi);
var row=AI_ROWS.filter(function(r){return r[0]===roll})[0];
return {roll:roll,row:row,level:level};
}
function aiPS(row,level){var p=String(row[2]).split(" ");return p[AI_LEVELS.indexOf(level)]}
var AI={ship:"Any",level:"Elite",cur:null,hist:[]};
function ownedShips(){
var names=AI_RANGES.map(function(r){return r[0]});
var o=names.filter(function(n){return S.owned[n]});
return o.length?o:names;
}
function aiFiltered(ship,level){
if(ship!=="Any")return aiGen(ship,level);
var ok=ownedShips(),tries=0,g;
do{g=aiGen("Any",level);tries++}while(ok.indexOf(g.row[1])<0&&tries<200);
return g;
}
function aiResult(g){

var DATA={v2manifest:null,v2ships:{},v1files:null,err:null,loading:false};
var BR={q:"",faction:"rebelalliance",ship:null,ownedOnly:false};
function fetchJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status+" "+u);return r.json()})}
function loadV2Manifest(){
if(DATA.v2manifest||DATA.loading||DATA.err)return;
DATA.loading=true;
fetchJSON(V2_BASE+"data/manifest.json").then(function(m){DATA.v2manifest=m;DATA.loading=false;render()}).catch(function(e){DATA.err=String(e.message||e);DATA.loading=false;render()});
}
function loadShip(path){
if(DATA.v2ships[path])return;
DATA.v2ships[path]="loading";
fetchJSON(V2_BASE+path).then(function(d){DATA.v2ships[path]=d;render()}).catch(function(e){DATA.v2ships[path]={error:String(e.message||e)};render()});
}
function loadV1(){
if(DATA.v1files||DATA.loading||DATA.err)return;
DATA.loading=true;
fetchJSON(V1_FLAT).then(function(d){DATA.v1files=d.files.map(function(f){return f.name}).filter(function(n){return/\.(png|jpg)$/i.test(n)});DATA.loading=false;render()}).catch(function(e){DATA.err=String(e.message||e);DATA.loading=false;render()});
}
